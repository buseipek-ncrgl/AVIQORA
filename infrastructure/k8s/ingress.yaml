apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aviqora-ingress
  namespace: aviqora
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
spec:
  tls:
  - hosts:
    - aviqora.com
    - api.aviqora.com
    secretName: aviqora-tls-secret
  rules:
  - host: aviqora.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aviqora-web-service
            port:
              number: 80
  - host: api.aviqora.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aviqora-api-service
            port:
              number: 5000
