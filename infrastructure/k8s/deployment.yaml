apiVersion: apps/v1
kind: Deployment
metadata:
  name: aviqora-api-deployment
  namespace: aviqora
  labels:
    app: aviqora-api
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aviqora-api
  template:
    metadata:
      labels:
        app: aviqora-api
    spec:
      containers:
      - name: aviqora-api
        image: aviqora/api:v3.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: aviqora-db-secret
              key: connection-string
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aviqora-web-deployment
  namespace: aviqora
  labels:
    app: aviqora-web
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aviqora-web
  template:
    metadata:
      labels:
        app: aviqora-web
    spec:
      containers:
      - name: aviqora-web
        image: aviqora/web:v3.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
